name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm
          - system: aarch64-darwin
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      - name: formatting
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.formatting
      - name: statix
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.statix
      - name: deadnix
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.deadnix
      - name: pre-commit
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.pre-commit

  eval:
    name: flake eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      # Realize all inputs (incl. transitive) first: yazelix's home-manager
      # module reads from an input source at eval time, which pure
      # `nix flake check` on a fresh store reports as "path ... is not valid".
      - run: nix flake archive
      - run: nix flake check --no-build --all-systems --print-build-logs

  # Build the Coder workspace image + NixOS toplevel and push them to the
  # ananthb cachix, so the private platform repo's coder-images job pulls the
  # closure from cache instead of rebuilding it. main only.
  cache-warm:
    name: cache-warm (coder image)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      - run: |
          nix build --no-link --print-build-logs \
            .#packages.x86_64-linux.coder-image

  # Tell the platform repo to rebuild the workspace image, now that the closure
  # it needs is in cachix. The receiving end has existed the whole time --
  # calculon-tech/platform .github/workflows/coder-images.yml declares
  # `repository_dispatch: types: [nixos-image]` -- but nothing here ever sent
  # the event, so GHCR only moved when someone dispatched the workflow by hand.
  #
  # needs: cache-warm, not just lint/eval. That job builds
  # packages.x86_64-linux.coder-image and pushes the closure; the image job on
  # the other side runs `nix build --max-jobs 0`, which refuses to compile
  # anything locally and fails in seconds if the path is not in the cache yet.
  # Its own comment says "the repository_dispatch can outrun it" -- ordering it
  # behind cache-warm here is what stops that.
  #
  # PLATFORM_DISPATCH_TOKEN because secrets.GITHUB_TOKEN is scoped to this repo
  # and these are different owners (ananthb -> calculon-tech), so it cannot
  # reach across. Managed in calculon-tech/platform tf/github/ananth.
  dispatch-coder-images:
    name: dispatch coder-images
    needs: [lint, eval, cache-warm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
    steps:
      # Degrade to a warning rather than a red main if the secret is not there
      # yet: it is created by terraform in the platform repo (tf/github/ananth),
      # so on a first run the two halves can land in either order.
      - name: no token
        if: env.GH_TOKEN == ''
        run: |
          echo "::warning::PLATFORM_DISPATCH_TOKEN is unset, so coder-images was not triggered. Dispatch it by hand, and see tf/github/ananth/actions-secrets.tf in calculon-tech/platform."
      - name: repository_dispatch → calculon-tech/platform
        if: env.GH_TOKEN != ''
        env:
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/calculon-tech/platform/dispatches \
            -f event_type=nixos-image \
            -f "client_payload[sha]=$SHA"
