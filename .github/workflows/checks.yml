name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm
          - system: aarch64-darwin
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      - name: formatting
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.formatting
      - name: statix
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.statix
      - name: deadnix
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.deadnix
      - name: pre-commit
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.pre-commit

  eval:
    name: flake eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      # Realize all inputs (incl. transitive) first: yazelix's home-manager
      # module reads from an input source at eval time, which pure
      # `nix flake check` on a fresh store reports as "path ... is not valid".
      - run: nix flake archive
      - run: nix flake check --no-build --all-systems --print-build-logs

  # Build the Coder workspace image + NixOS toplevel and push them to the
  # ananthb cachix, so the private platform repo's coder-images job pulls the
  # closure from cache instead of rebuilding it. main only.
  cache-warm:
    name: cache-warm (coder image)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      - run: |
          nix build --no-link --print-build-logs \
            .#packages.x86_64-linux.coder-image

  # Build the Chromebook's Baguette rootfs image and publish it as a workflow
  # artifact. Nothing else in this setup can build it: the image is
  # aarch64-linux, and the Mac that manages this repo is aarch64-darwin with no
  # linux-builder, so without this job the only way to get an image is to build
  # it from inside an already-running VM. Downloading the artifact instead makes
  # bootstrapping a VM a single step, from an image that already has the right
  # uid 1000. See hosts/chromebook.nix. main only, since a config change
  # rebuilds the whole toplevel and then the image on top of it.
  baguette-image:
    name: baguette-image (aarch64-linux)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # virtualisation.diskImageSize is 12G, and the uncompressed system
      # tarball, the raw btrfs image and its zstd copy are all realised into the
      # store together. The hosted arm64 runner starts with roughly 14G free, so
      # hand back what the runner image is sitting on before building.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules || true
          sudo docker image prune -af || true
          df -h /
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,lanzaboote
      # The btrfs image is assembled in a qemu VM (vmTools.runInLinuxVM). The
      # baguette module clears requiredSystemFeatures on it, so this does not
      # need /dev/kvm on the runner.
      - run: nix build --print-build-logs .#packages.aarch64-linux.baguette-zimage
      - run: df -h /
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: baguette-rootfs-aarch64
          path: result/baguette_rootfs.img.zst
